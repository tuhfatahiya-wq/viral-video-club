<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>Viral Video Club</title>
<style>
:root {
  --bg:#09090d;
  --panel:#15151d;
  --text:#f7f7fb;
  --muted:#9696a5;
  --orange:#ff6a22;
  --red:#ff3157;
  --line:#292936;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.app {
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 100px;
  background:radial-gradient(ellipse at 80% 0%,#34131c,transparent 34%),var(--bg);
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.brand {display:flex;gap:10px;align-items:center}
.logo {
  width:42px;height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--orange),var(--red));
  display:grid;place-items:center;
  font-size:22px;
}
.brand strong {display:block;font-size:15px}
.brand small {color:var(--muted);font-size:11px}
.hero {
  border:1px solid #64302b;
  border-radius:22px;
  padding:21px;
  background:linear-gradient(115deg,#30151a,#17151d 65%,#25202b);
  margin-bottom:25px;
}
.eyebrow {color:#ff9a67;font-size:11px;font-weight:bold}
.hero h1 {font-size:27px;line-height:1.1}
.hero p {color:#c4b9bd;font-size:13px}
.primary {
  border:0;border-radius:12px;
  padding:12px 18px;color:white;
  font-weight:bold;
  background:linear-gradient(100deg,var(--orange),var(--red));
}
.section {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:23px 0 13px;
}
.section h2 {font-size:17px}
.section a {font-size:12px;color:#ff8b60}
.chips {display:flex;gap:8px;overflow:auto}
.chip {
  white-space:nowrap;
  border:1px solid var(--line);
  border-radius:30px;
  padding:8px 13px;
  color:#b9b9c5;
  background:var(--panel);
}
.chip.active {
  background:#3b1c1c;
  border-color:#8b3c2c;
  color:#ff9a67;
}
.cards {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.video {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.thumb {
  height:116px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:linear-gradient(135deg,#452126,#201d30,#482c1c);
  font-size:42px;
}
.two {background:linear-gradient(135deg,#18343b,#27213d,#45242e)}
.three {background:linear-gradient(135deg,#33224b,#572b32)}
.four {background:linear-gradient(135deg,#49351e,#28243b)}
.play {
  position:absolute;
  width:36px;height:36px;
  border-radius:50%;
  display:grid;place-items:center;
  background:#08080dcc;
  font-size:13px;
}
.tag {
  position:absolute;left:9px;top:9px;
  background:#ff512e;
  padding:3px 7px;
  border-radius:6px;
  font-size:9px;font-weight:bold;
}
.duration {
  position:absolute;right:8px;bottom:8px;
  background:#050509c9;
  border-radius:5px;padding:3px 6px;
  font-size:10px;
}
.info {padding:10px}
.info strong {
  font-size:12px;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.meta {color:var(--muted);font-size:10px;margin-top:5px}
.empty {
  border:1px dashed #383845;
  border-radius:15px;
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:12px;
}
nav {
  position:fixed;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#111118f2;
  border-top:1px solid var(--line);
  padding:10px 5px;
}
nav button {
  background:none;border:0;
  color:#858594;font-size:10px;
  display:grid;gap:4px;
  justify-items:center;
}
nav button span {font-size:19px}
nav button.active {color:#ff8752}
.toast {
  position:fixed;bottom:75px;left:50%;
  transform:translateX(-50%);
  background:#272731;color:white;
  padding:10px 14px;border-radius:10px;
  font-size:12px;display:none;
}
</style>
</head>
<body>
<main class="app">

<header>
 <div class="brand">
  <div class="logo">▶</div>
  <div>
   <strong>VIRAL VIDEO CLUB</strong>
   <small>Watch • Discover • Enjoy</small>
  </div>
 </div>
 <button onclick="notify('Notifications coming soon')">♧</button>
</header>

<section class="hero">
 <div class="eyebrow">YOUR DAILY VIDEO HUB</div>
 <h1>Discover what's<br>trending today.</h1>
 <p>Explore the latest additions and popular videos in one place.</p>
 <button class="primary" onclick="document.getElementById('trending').scrollIntoView({behavior:'smooth'})">
 ▶ Explore Videos
 </button>
</section>

<div class="section">
 <h2>Browse Categories</h2>
 <a href="#">View all</a>
</div>

<div class="chips">
 <button class="chip active">All</button>
 <button class="chip">Trending</button>
 <button class="chip">Latest</button>
 <button class="chip">Popular</button>
</div>

<div class="section" id="trending">
  <h2>🎬 Selected Video</h2>
</div>

<div id="video-container" class="cards">
  <div class="empty">ভিডিওর তথ্য লোড হচ্ছে...</div>
</div>
<!-- Adsterra Native Banner -->
<div id="container-1c953d8edfd133a37df0324c4476df4b"></div>
<script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/1c953d8edfd133a37df0324c4476df4b"></script>

</main>

<nav>
 <button class="active" onclick="setTab(this,'Home')">
  <span>⌂</span>Home
 </button>
 <button onclick="setTab(this,'Explore')">
  <span>◉</span>Explore
 </button>
 <button onclick="setTab(this,'Rewards')">
  <span>▣</span>Rewards
 </button>
 <button onclick="setTab(this,'Profile')">
  <span>♙</span>Profile
 </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(window.location.search);
const videoId = params.get("video");

const container = document.getElementById("video-container");
const heading = document.querySelector("#trending h2");

// দুই কলামের ডিজাইন
const style = document.createElement("style");
style.textContent = `
  #video-container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 10px 0;
  }

  .video-card {
    min-width: 0;
    overflow: hidden;
    background: #19182d;
    border: 1px solid #292840;
    border-radius: 15px;
  }

  .video-card img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
  }

  .video-info {
    padding: 10px;
  }

  .video-info strong {
    display: block;
    color: white;
    font-size: 14px;
    line-height: 1.4;
    min-height: 40px;
  }

  .watch-button {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 10px 4px;
    border: 0;
    border-radius: 10px;
    background: #8954f5;
    color: white;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }

  .video-back {
    display: inline-block;
    margin: 10px 0;
    color: #a77aff;
    text-decoration: none;
  }
`;
document.head.appendChild(style);

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function loadVideos() {
  try {
    if (videoId) {
      heading.textContent = "🎬 Video Details";
    } else {
      heading.textContent = "🎬 All Videos";
    }

    const url = videoId
      ? `https://viral-video-club.onrender.com/api/videos/${encodeURIComponent(videoId)}`
      : "https://viral-video-club.onrender.com/api/videos";

    const response = await fetch(url);

    if (!response.ok) throw new Error("ভিডিও পাওয়া যায়নি");

    const result = await response.json();

    const videos = videoId ? [result] : result;

    if (!videos.length) {
      container.innerHTML =
        '<div class="empty">এখনো কোনো ভিডিও যোগ করা হয়নি।</div>';
      return;
    }

    if (videoId) {
  container.style.display = "grid";
  container.style.gridTemplateColumns = "1fr";

  container.innerHTML = `
  <a class="video-back"
     href="https://tuhfatahiya-wq.github.io/viral-video-club/">
    ← সব ভিডিওতে ফিরে যান
  </a>

  ${makeCard(videos[0], false)}

  <div style="
    margin-top:20px;
    padding:18px;
    background:#19182d;
    border:1px solid #303047;
    border-radius:18px;
    color:white;
  ">
    <h3 style="margin:0 0 22px;">
      🔓 Complete steps to unlock video
    </h3>

    <div style="
      display:flex;
      justify-content:space-between;
      text-align:center;
      gap:8px;
    ">
      <div>
        <div style="
          width:54px;height:54px;
          border:3px solid #8954f5;
          border-radius:50%;
          display:grid;place-items:center;
          font-size:22px;
        ">▶</div>
        <small style="color:#a77aff;">AD 1</small>
      </div>

      <div>
        <div style="
          width:54px;height:54px;
          border:3px solid #41465a;
          border-radius:50%;
          display:grid;place-items:center;
          font-size:20px;
        ">2</div>
        <small style="color:#9295a8;">AD 2</small>
      </div>

      <div>
        <div style="
          width:54px;height:54px;
          border:3px solid #41465a;
          border-radius:50%;
          display:grid;place-items:center;
          font-size:20px;
        ">3</div>
        <small style="color:#9295a8;">AD 3</small>
      </div>
    </div>

    <button disabled style="
      width:100%;
      margin-top:28px;
      padding:17px;
      border:0;
      border-radius:14px;
      background:#8954f5;
      color:white;
      font-size:19px;
      font-weight:bold;
      opacity:.65;
    ">
      🔒 UNLOCK — 0/3
    </button>

    <p style="
      text-align:center;
      color:#a5a5b5;
      font-size:12px;
      margin-bottom:0;
    ">
      বিজ্ঞাপন যাচাই ব্যবস্থা যুক্ত হলে চালু হবে।
    </p>
<a href="${escapeHTML(videos[0].delivery_url || 'https://t.me/ViralVideoDeliveryBot')}"
   style="
     display:block;
     margin-top:18px;
     padding:16px;
     background:#8954f5;
     color:white;
     text-align:center;
     text-decoration:none;
     border-radius:14px;
     font-size:18px;
     font-weight:bold;
   ">
  🚀 START BOT
</a>
  </div>
`;
    } else {
      container.innerHTML = videos
        .map(video => makeCard(video, true))
        .join("");
    }

  } catch (error) {
    console.error(error);
    container.innerHTML =
      '<div class="empty">ভিডিও লোড করা যায়নি। আবার চেষ্টা করুন।</div>';
  }
}

function makeCard(video, showButton) {
  const title = escapeHTML(video.caption || video.title || "ভিডিও");
  const thumbnail = video.thumbnail_url
    ? `<img src="${escapeHTML(video.thumbnail_url)}" alt="ভিডিও থাম্বনেইল">`
    : `<div style="aspect-ratio:4/5;display:grid;place-items:center;color:white;">🖼️</div>`;

  const button = showButton
    ? `<a class="watch-button" href="?video=${encodeURIComponent(video.id)}">▶ Watch Now</a>`
    : "";

  return `
    <article class="video-card">
      ${thumbnail}
      <div class="video-info">
        <strong>${title}</strong>
        ${button}
      </div>
    </article>
  `;
}

loadVideos();
</script>

</body>
</html>
